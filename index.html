<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مين هيتفشخ 🎯</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('IMG20260609224534.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      cursor: pointer;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 440px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.4);
      cursor: default;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .card.hidden {
      display: none;
    }

    h2 {
      margin-bottom: 18px;
      color: #1e293b;
      font-size: 24px;
      font-weight: 800;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px 45px 12px 12px; /* مساحة لزر الميكروفون */
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      resize: none;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.95);
    }

    textarea:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    /* زر الميكروفون داخل التكست اريا */
    .voice-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #e2e8f0;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      transition: all 0.2s ease;
      box-shadow: none;
    }

    .voice-btn:hover {
      background: #cbd5e1;
    }

    /* تأثير عند التحدث/التسجيل */
    .voice-btn.listening {
      background: #ef4444;
      color: white;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .wheel-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 20px auto;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ef4444;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    #spinBtn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: transform 0.1s, background 0.2s;
    }

    #spinBtn:hover {
      background: linear-gradient(135deg, #059669, #047857);
    }

    #spinBtn:active {
      transform: scale(0.98);
    }

    #spinBtn:disabled {
      background: #9ca3af;
      box-shadow: none;
      cursor: not-allowed;
    }

    .result {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 800;
      color: #dc2626;
      min-height: 32px;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h2>قرعة مين هيتفشخ 🎯</h2>
    
    <div class="input-wrapper">
      <textarea id="namesInput" placeholder="اكتب الأسماء هنا أو استخدم الميكروفون..."></textarea>
      <button class="voice-btn" id="voiceBtn" title="إضافة أسماء بالصوت">🎤</button>
    </div>
    
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="260" height="260"></canvas>
    </div>

    <button id="spinBtn" onclick="spinWheel()">لف العجلة واعرف مين هيتفشخ!</button>

    <div class="result" id="resultDisplay"></div>
  </div>

  <script>
    const card = document.getElementById('mainCard');
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const namesInput = document.getElementById('namesInput');
    const spinBtn = document.getElementById('spinBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const resultDisplay = document.getElementById('resultDisplay');

    // إخفاء وإظهار الكارت عند الضغط خارج المساحة الخاصة به
    document.addEventListener('click', (e) => {
      if (!card.contains(e.target)) {
        card.classList.toggle('hidden');
      }
    });

    const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6', '#fb923c', '#4ade80'];

    let currentAngle = 0;
    let isSpinning = false;

    // تحميل الأسماء المحفوظة سابقاً
    const savedNames = localStorage.getItem('sakr_wheel_names');
    if (savedNames) {
      namesInput.value = savedNames;
    }

    // حفظ الأسماء وإعادة الرسم عند التغيير
    namesInput.addEventListener('input', saveAndDraw);

    function saveAndDraw() {
      localStorage.setItem('sakr_wheel_names', namesInput.value);
      drawWheel();
    }

    // --- خاصية الإدخال الصوتي (Speech Recognition) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-EG'; // تعيين اللغة العربية
      recognition.continuous = false;
      recognition.interimResults = false;

      voiceBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // منع إغلاق الكارت
        recognition.start();
      });

      recognition.onstart = () => {
        voiceBtn.classList.add('listening');
      };

      recognition.onend = () => {
        voiceBtn.classList.remove('listening');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        // تقطيع الكلمات المسموعة وإضافتها كل اسم في سطر جديد
        const spokenNames = transcript.split(' ').filter(n => n.trim() !== '').join('\n');
        
        if (namesInput.value.trim() === '') {
          namesInput.value = spokenNames;
        } else {
          namesInput.value += '\n' + spokenNames;
        }

        saveAndDraw();
      };

      recognition.onerror = () => {
        voiceBtn.classList.remove('listening');
      };
    } else {
      voiceBtn.style.display = 'none'; // إخفاء الزر إذا كان المتصفح لا يدعم الميكروفون
    }

    function getNames() {
      return namesInput.value.split('\n').map(name => name.trim()).filter(name => name !== '');
    }

    function drawWheel() {
      const names = getNames();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (names.length === 0) {
        ctx.beginPath();
        ctx.arc(130, 130, 120, 0, 2 * Math.PI);
        ctx.fillStyle = '#e2e8f0';
        ctx.fill();
        ctx.fillStyle = '#64748b';
        ctx.font = '16px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('هتستعبط', 130, 135);
        return;
      }

      const arcSize = (2 * Math.PI) / names.length;

      names.forEach((name, index) => {
        const angle = currentAngle + index * arcSize;

        ctx.beginPath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.moveTo(130, 130);
        ctx.arc(130, 130, 120, angle, angle + arcSize);
        ctx.lineTo(130, 130);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(130, 130);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 15px system-ui';
        ctx.fillText(name, 100, 5);
        ctx.restore();
      });
    }

    function spinWheel() {
      const names = getNames();
      if (names.length < 2) {
        alert('هتستعبط!');
        return;
      }

      if (isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;
      resultDisplay.innerText = '';

      const spinAngle = Math.random() * 10 + 20;
      const spinTimeTotal = Math.random() * 3000 + 4000;
      let spinTime = 0;

      function rotate() {
        spinTime += 30;
        if (spinTime >= spinTimeTotal) {
          stopRotate();
          return;
        }

        const progress = spinTime / spinTimeTotal;
        const easeOut = Math.pow(progress - 1, 3) + 1;
        currentAngle += (spinAngle * (1 - easeOut)) * (Math.PI / 180);

        drawWheel();
        requestAnimationFrame(rotate);
      }

      rotate();
    }

    function stopRotate() {
      isSpinning = false;
      spinBtn.disabled = false;

      const names = getNames();
      const arcSize = (2 * Math.PI) / names.length;
      
      let normalizedAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
      if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

      const winningIndex = Math.floor(normalizedAngle / arcSize);
      const winner = names[winningIndex];

      resultDisplay.innerText = `🎉 ابن المحظوظة هو: ${winner}`;
    }

    drawWheel();
  </script>
</body>
</html>
